<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Constelação de Memórias — Corações</title>
  <meta name="description" content="Um céu interativo onde cada estrela é uma lembrança: músicas, fotos e vídeos. Conecte as estrelas e veja corações nascerem." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#f0f3ff; --muted:#a6a6b0; --accent:#ff7a59; --bg:#05060a; --line:#6ee7b7; --star:#ffffff;
      --panel:#0e1016; --panel2:#141723; --soft:#1c2130; --pink:#ff6aa6; --rose:#ff89b5; --green:#6ee7b7;
    }
    *{box-sizing:border-box}
    html,body{height:100%; margin:0; background:radial-gradient(1200px 800px at 10% 10%, #0c0f18 0, #070910 40%, #03050a 100%); font-family:Poppins,system-ui,Segoe UI,Roboto,Arial; color:var(--ink);}
    canvas#sky{position:fixed; inset:0; z-index:0; touch-action:none}
    .hud{position:fixed; inset:auto 0 0 0; display:flex; gap:10px; align-items:center; padding:10px 12px; background:linear-gradient(180deg, transparent, rgba(0,0,0,.6)); z-index:3}
    .hud .card{background:rgba(20,23,35,.85); border:1px solid rgba(255,255,255,.06); backdrop-filter: blur(6px); border-radius:14px; padding:10px 12px; display:flex; align-items:center; gap:10px}
    .hud b{font-weight:600}
    .hud button{border:0; background:var(--accent); color:#fff; border-radius:12px; padding:10px 12px; cursor:pointer}
    .hud button.ghost{background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,.18)}
    .hud button.tiny{padding:10px 12px; font-size:14px}
    .hud .title{font-size:14px; color:var(--muted)}
    .kbd{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; background:#10131c; border:1px solid rgba(255,255,255,.12); padding:2px 6px; border-radius:6px; font-size:12px; color:#b9c0ff}

    .topbar{position:fixed; top:12px; left:12px; right:12px; z-index:3; display:flex; gap:10px; align-items:center; justify-content:space-between}
    .logo{background:rgba(20,23,35,.75); border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:10px 14px}
    .logo h1{margin:0; font-size:16px; letter-spacing:.3px}
    .help{background:rgba(20,23,35,.75); border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:10px 14px; max-width:480px}
    .help p{margin:0; font-size:13px; color:var(--muted)}

    .tip{position:fixed; pointer-events:none; z-index:4; padding:8px 10px; border-radius:10px; background:#0f1320; border:1px solid rgba(255,255,255,.1); color:#dfe4ff; font-size:13px; opacity:0; transform:translate(-50%, -140%) translateZ(0); white-space:nowrap}

    .modal{position:fixed; inset:0; display:none; place-items:center; z-index:5;}
    .modal.show{display:grid}
    .shade{position:absolute; inset:0; background:rgba(0,0,0,.78); backdrop-filter: blur(4px)}
    .box{position:relative; z-index:1; background:var(--panel2); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:12px; max-width:min(92vw, 980px); max-height:min(86vh, 720px); display:flex; flex-direction:column; gap:10px}
    .box header{display:flex; align-items:center; justify-content:space-between}
    .box header .meta{font-size:14px; color:var(--muted)}
    .box header button{border:0; background:transparent; color:var(--ink); border:1px solid rgba(255,255,255,.16); padding:10px 12px; border-radius:12px; cursor:pointer}
    .box .viewer{display:grid; place-items:center; overflow:auto; border-radius:12px; background:#0b0f1a}
    .box img,.box video{max-width:100%; max-height:70vh}

    .toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%); background:rgba(0,0,0,.6); color:#fff; padding:10px 14px; border-radius:12px; font-size:13px; opacity:0; transition:.4s}
    .toast.show{opacity:1}

    @media (max-width:640px){
      .help{display:none}
      .hud{flex-wrap:wrap; gap:8px; padding-bottom:12px}
      .hud .card{width:100%; justify-content:center}
      .hud .title{font-size:12px}
      .logo h1{font-size:14px}
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>

  <div class="topbar">
    <div class="logo"><h1>Constelação de Memórias 💖</h1></div>
    <div class="help"><p>Cada estrela é uma lembrança. Toque/clique para abrir. As linhas formam <b>corações</b> à medida que você conecta memórias. <span class="kbd">Esc</span> fecha a mídia.</p></div>
  </div>

  <div class="hud">
    <div class="card" style="gap:10px">
      <span class="title">Tocando:</span>
      <b id="now">—</b>
      <button id="prev" class="ghost tiny" title="Anterior">⏮</button>
      <button id="play" class="tiny" title="Play/Pause">▶</button>
      <button id="next" class="ghost tiny" title="Próxima">⏭</button>
      <button id="shuffle" class="ghost tiny" title="Shuffle">🔀</button>
      <button id="clear" class="ghost tiny" title="Limpar linhas">Limpar</button>
    </div>
    <div class="card" style="min-width:260px; flex:1">
      <input id="seek" type="range" min="0" max="100" value="0" style="width:100%">
    </div>
  </div>

  <div class="tip" id="tip"></div>

  <div class="modal" id="modal">
    <div class="shade" onclick="closeModal()"></div>
    <div class="box">
      <header>
        <div class="meta"><b id="modalTitle">Lembrança</b></div>
        <button onclick="closeModal()">Fechar ✕</button>
      </header>
      <div class="viewer" id="modalViewer"></div>
    </div>
  </div>

  <div id="toast" class="toast">Ligando estrelas…</div>

  <audio id="player" preload="metadata"></audio>

  <script>
  // ======= DADOS =======
  // Músicas (todas as 16)
  const tracks = [
    { title: 'Vampiro — YMA', url: 'https://files.catbox.moe/31ie8h.mp3' },
    { title: 'Stjernestov — AURORA', url: 'https://files.catbox.moe/zxrl06.mp3' },
    { title: 'Die for You — The Weeknd', url: 'https://files.catbox.moe/3saxi8.mp3' },
    { title: 'Insista em mim — Ana Frango Elétrico', url: 'https://files.catbox.moe/puedbp.mp3' },
    { title: 'Exist for Love — AURORA', url: 'https://files.catbox.moe/5q7laf.mp3' },
    { title: 'Je te laisserai des mots — Patrick Watson', url: 'https://files.catbox.moe/s85j4h.mp3' },
    { title: 'Entrelaços — Scalene', url: 'https://files.catbox.moe/n0l79n.mp3' },
    { title: 'Roi — Videoclub', url: 'https://files.catbox.moe/gj5pcc.mp3' },
    { title: 'I Wanna Be Yours — Arctic Monkeys', url: 'https://files.catbox.moe/e0xrnv.mp3' },
    { title: 'Demorou pra ser — Vanguart', url: 'https://files.catbox.moe/g0zj69.mp3' },
    { title: 'Quando bate aquela saudade — Rubel', url: 'https://files.catbox.moe/2njjlr.mp3' },
    { title: 'Querida — Chapéu de Palha', url: 'https://files.catbox.moe/njueko.mp3' },
    { title: 'Dezembro — Arthur Diniz', url: 'https://files.catbox.moe/xw5qg3.mp3' },
    { title: 'Rosa e Laranja — Mariana Froes', url: 'https://files.catbox.moe/ksucov.mp3' },
    { title: 'Só nós dois — Tim Bernardes', url: 'https://files.catbox.moe/rwdgnt.mp3' },
    { title: 'Be There — Seafret', url: 'https://files.catbox.moe/z8hfh1.mp3' },
  ];

  // Novas mídias (4 vídeos + 11 imagens)
  const visuals = [
    { type: 'video', title: 'Vídeo 1', url: 'https://files.catbox.moe/knzf7g.mp4' },
    { type: 'video', title: 'Vídeo 2', url: 'https://files.catbox.moe/qwaass.mp4' },
    { type: 'video', title: 'Vídeo 3', url: 'https://files.catbox.moe/xu7wam.mp4' },
    { type: 'video', title: 'Vídeo 4', url: 'https://files.catbox.moe/jwvm1h.mp4' },
    { type: 'image', title: 'Foto A', url: 'https://files.catbox.moe/72mh8x.jpeg' },
    { type: 'image', title: 'Foto B', url: 'https://files.catbox.moe/ufb6qv.jpg' },
    { type: 'image', title: 'Foto C', url: 'https://files.catbox.moe/dey86y.jpg' },
    { type: 'image', title: 'Foto D', url: 'https://files.catbox.moe/qbm3fz.jpg' },
    { type: 'image', title: 'Foto E', url: 'https://files.catbox.moe/ajy2ms.jpg' },
    { type: 'image', title: 'Foto F', url: 'https://files.catbox.moe/wfz97r.jpg' },
    { type: 'image', title: 'Foto G', url: 'https://files.catbox.moe/poqbog.jpg' },
    { type: 'image', title: 'Foto H', url: 'https://files.catbox.moe/dpsryy.jpg' },
    { type: 'image', title: 'Foto I', url: 'https://files.catbox.moe/k2mkpf.jpg' },
    { type: 'image', title: 'Foto J', url: 'https://files.catbox.moe/bj4c4b.jpg' },
    { type: 'image', title: 'Foto K', url: 'https://files.catbox.moe/sbkpej.jpg' },
  ];

  // ======= ESTADO =======
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const tip = document.getElementById('tip');
  const toast = document.getElementById('toast');
  const player = document.getElementById('player');
  const nowEl = document.getElementById('now');
  const seek = document.getElementById('seek');
  const btnPlay = document.getElementById('play');
  const btnNext = document.getElementById('next');
  const btnPrev = document.getElementById('prev');
  const btnShuffle = document.getElementById('shuffle');
  const btnClear = document.getElementById('clear');

  let W=innerWidth, H=innerHeight; canvas.width=W; canvas.height=H;
  addEventListener('resize',()=>{ W=innerWidth; H=innerHeight; canvas.width=W; canvas.height=H; layoutStars(); });

  // densidade adaptativa para mobile
  const isMobile = matchMedia('(max-width: 640px)').matches;
  const baseRadiusAudio = isMobile ? 5 : 3.2;
  const baseRadiusImage = isMobile ? 8.5 : 6.8;
  const baseRadiusVideo = isMobile ? 9.5 : 7.8;

  // poeira de fundo
  const dust = Array.from({length: isMobile? 180: 260}, ()=> ({
    x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.3+0.25, s: Math.random()*0.6+0.2
  }));

  // nós interativos
  const nodes = []; // {x,y,r,type,title,url,index}
  const visited = []; // ordem clicada
  let hoverIndex = -1;

  function layoutStars(){
    nodes.length = 0;
    const all = [
      ...tracks.map((t,i)=>({kind:'audio', title:t.title, url:t.url, size:baseRadiusAudio, i})),
      ...visuals.map((m,i)=>({kind:m.type, title:m.title, url:m.url, size: m.type==='video'? baseRadiusVideo : baseRadiusImage, i}))
    ];
    const pad = isMobile? 18 : 28; const triesMax=5000;
    for(const item of all){
      let x,y,ok=false, tries=0, r=item.size;
      while(!ok && tries<triesMax){
        x = pad + Math.random()*(W-2*pad);
        y = pad + Math.random()*(H-2*pad);
        ok = true;
        for(const n of nodes){
          const dx=x-n.x, dy=y-n.y, d=Math.hypot(dx,dy);
          if(d < (r+n.r+ (isMobile? 18:12))) { ok=false; break; }
        }
        tries++;
      }
      nodes.push({x,y,r, type:item.kind, title:item.title, url:item.url, index:item.i});
    }
  }
  layoutStars();

  // ======= DESENHO =======
  function draw(){
    ctx.clearRect(0,0,W,H);
    const g = ctx.createRadialGradient(W*0.1,H*0.1,10, W*0.1,H*0.1, W*0.85);
    g.addColorStop(0,'rgba(255,255,255,0.04)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

    for(const s of dust){
      s.x += (Math.sin(s.y*0.005)+0.2)*0.02; if(s.x>W) s.x=0; if(s.x<0) s.x=W;
      ctx.globalAlpha = 0.6 + Math.sin((s.x+s.y+performance.now()*0.001)*s.s)*0.4;
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fillStyle='#bcd2ff'; ctx.fill();
    } ctx.globalAlpha = 1;

    // linhas/corações entre visitados
    if(visited.length>1){
      for(let i=0;i<visited.length-1;i++){
        const a = nodes[visited[i]]; const b = nodes[visited[i+1]];
        drawHeartLine(a.x,a.y,b.x,b.y);
      }
      // se visitou tudo, desenha um coração grande central
      if(visitedAll()) drawBigHeart();
    }

    for(let i=0;i<nodes.length;i++){
      const n = nodes[i]; const glow = (hoverIndex===i)? 0.9 : 0.4;
      const grd = ctx.createRadialGradient(n.x,n.y,0, n.x,n.y, n.r*3.2);
      const col = n.type==='audio'? '255,255,255' : (n.type==='video'? '255,122,89' : '110,231,183');
      grd.addColorStop(0, `rgba(${col},${0.35+glow*0.2})`); grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(n.x,n.y,n.r*3.2,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle = n.type==='audio'? '#ffffff' : (n.type==='video'? '#ff7a59' : '#6ee7b7');
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = (hoverIndex===i? 18:8); ctx.fill(); ctx.shadowBlur=0;
    }
    requestAnimationFrame(draw);
  }
  draw();

  // ======= INTERAÇÃO =======
  function pick(mx,my){
    for(let i=nodes.length-1;i>=0;i--){
      const n=nodes[i]; const d=Math.hypot(mx-n.x,my-n.y);
      if(d < n.r+12) return i;
    } return -1;
  }

  // suporte a toque (mobile)
  function getPos(e){
    if(e.touches && e.touches[0]){ const r = canvas.getBoundingClientRect(); return {x:e.touches[0].clientX-r.left, y:e.touches[0].clientY-r.top}; }
    return {x:e.offsetX, y:e.offsetY};
  }

  canvas.addEventListener('mousemove', (e)=>{
    const i = pick(e.offsetX, e.offsetY); hoverIndex = i;
    if(i>-1){ tip.style.left = e.pageX+'px'; tip.style.top = e.pageY+'px'; tip.textContent = nodes[i].title || label(nodes[i]); tip.style.opacity = 1; }
    else tip.style.opacity=0;
  });
  canvas.addEventListener('mouseleave', ()=>{ tip.style.opacity=0; hoverIndex=-1; });
  canvas.addEventListener('click', (e)=>{ const i=pick(e.offsetX,e.offsetY); if(i>-1) openNode(i); });
  canvas.addEventListener('touchstart', (e)=>{ const p=getPos(e); const i=pick(p.x,p.y); if(i>-1){ openNode(i); tip.style.opacity=0; } });

  function label(n){ return n.type==='audio'? 'Música' : (n.type==='video'?'Vídeo':'Foto'); }

  function openNode(i){
    const n = nodes[i]; if(visited[visited.length-1]!==i){ visited.push(i); flash('Ligando estrelas…'); }
    if(n.type==='audio') playTrackByUrl(n.url, n.title);
    else if(n.type==='image') openModal(`<img alt="${escapeHtml(n.title)}" src="${n.url}">`, n.title);
    else if(n.type==='video') openModal(`<video controls autoplay playsinline src="${n.url}"></video>`, n.title);
  }

  // ======= MODAL =======
  function openModal(inner, title='Lembrança'){
    document.getElementById('modalTitle').textContent = title;
    const viewer = document.getElementById('modalViewer'); viewer.innerHTML = inner;
    document.getElementById('modal').classList.add('show');
  }
  function closeModal(){ document.getElementById('modal').classList.remove('show'); document.getElementById('modalViewer').innerHTML=''; }
  addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

  // ======= PLAYER =======
  let queue = tracks.map((t,i)=> i); let current = -1; let shuffle = false;
  // nowEl JÁ foi declarado na seção ESTADO

  function playTrackByUrl(url, title){ player.src=url; player.play().catch(()=>{}); nowEl.textContent = title || '—'; btnPlay.textContent = '⏸'; }
  function playByIndex(i){ current=i; const t=tracks[i]; playTrackByUrl(t.url, t.title); }
  function next(){ if(shuffle){ const options=queue.filter(idx=>idx!==current); if(!options.length) return; playByIndex(options[Math.floor(Math.random()*options.length)]);} else { const pos=queue.indexOf(current); playByIndex(queue[(pos+1)%queue.length]); } }
  function prev(){ if(shuffle){ next(); return; } const pos=queue.indexOf(current); playByIndex(queue[(pos-1+queue.length)%queue.length]); }

  btnPlay.onclick = ()=>{ if(player.paused){ player.play(); btnPlay.textContent='⏸'; } else { player.pause(); btnPlay.textContent='▶'; } };
  btnNext.onclick = next; btnPrev.onclick = prev;
  btnShuffle.onclick = ()=>{ shuffle=!shuffle; btnShuffle.classList.toggle('active'); btnShuffle.textContent = shuffle? '🔀 ON' : '🔀'; };
  btnClear.onclick = ()=>{ visited.length=0; flash('Constelação limpa'); };
  player.addEventListener('ended', next);
  player.addEventListener('timeupdate', ()=>{ if(!isFinite(player.duration)) return; seek.value = (player.currentTime/player.duration)*100; });
  seek.addEventListener('input', ()=>{ if(!isFinite(player.duration)) return; player.currentTime = (seek.value/100)*player.duration; });
  addEventListener('keydown', (e)=>{ if(e.code==='Space' && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))){ e.preventDefault(); btnPlay.click(); } });

  // ======= CORAÇÕES =======
  function drawHeartLine(x1,y1,x2,y2){
    // ponto médio
    const mx=(x1+x2)/2, my=(y1+y2)/2; const len=Math.hypot(x2-x1,y2-y1);
    // desenha linha suave
    const grad = ctx.createLinearGradient(x1,y1,x2,y2);
    grad.addColorStop(0,'rgba(255,137,181,0.0)'); grad.addColorStop(0.5,'rgba(255,137,181,0.8)'); grad.addColorStop(1,'rgba(255,137,181,0.0)');
    ctx.strokeStyle=grad; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    // coraçãozinho no meio
    drawSmallHeart(mx,my, Math.max(6, Math.min(12, len*0.04)) );
  }

  function drawSmallHeart(x,y,size){
    ctx.save(); ctx.translate(x,y); ctx.scale(size/20,size/20); // coração base ~20px
    ctx.beginPath();
    ctx.moveTo(0,-6);
    ctx.bezierCurveTo(8,-16, 22,-4, 0, 16);
    ctx.bezierCurveTo(-22,-4, -8,-16, 0,-6);
    const grad = ctx.createRadialGradient(0,0,2, 0,0,18);
    grad.addColorStop(0,'rgba(255,106,166,0.95)'); grad.addColorStop(1,'rgba(255,106,166,0.15)');
    ctx.fillStyle=grad; ctx.fill();
    ctx.restore();
  }

  function visitedAll(){ return visited.filter((v,i,self)=> self.indexOf(v)===i).length === nodes.length; }

  function drawBigHeart(){
    const cx=W/2, cy=H/2; const size = Math.min(W,H)*0.18;
    ctx.save(); ctx.globalAlpha=0.9; ctx.shadowColor='#ff6aa6'; ctx.shadowBlur=18; ctx.lineWidth=3; ctx.strokeStyle='rgba(255,106,166,0.9)';
    ctx.beginPath();
    // path do coração grande (contorno)
    ctx.moveTo(cx, cy - size*0.35);
    ctx.bezierCurveTo(cx + size*0.6, cy - size*0.95, cx + size*1.35, cy + size*0.1, cx, cy + size*0.95);
    ctx.bezierCurveTo(cx - size*1.35, cy + size*0.1, cx - size*0.6, cy - size*0.95, cx, cy - size*0.35);
    ctx.stroke();
    ctx.restore();
  }

  // ======= TESTES RÁPIDOS (não alteram comportamento) =======
  (function(){
    console.assert(!!nowEl && nowEl.id==='now', 'nowEl não encontrado ou incorreto');
    console.assert(document.querySelectorAll('#now').length===1, 'Existe mais de um elemento com id="now"');
  })();

  // ======= UTILS =======
  function flash(text){ toast.textContent=text; toast.classList.add('show'); clearTimeout(flash._t); flash._t=setTimeout(()=>toast.classList.remove('show'), 1100); }
  function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
  </script>
</body>
</html>
